services:
  backend:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8080"
      APP_NAME: ${APP_NAME:-diuk-backend}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_MENU_BUCKET: ${SUPABASE_STORAGE_MENU_BUCKET:-diuk-menu-images}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_MODE: ${APP_MODE:-all}
      REDIS_QUEUE_PREFIX: ${REDIS_QUEUE_PREFIX:-diuk}
      WORKER_AI_CONCURRENCY: ${WORKER_AI_CONCURRENCY:-2}
      WORKER_DELIVERY_CONCURRENCY: ${WORKER_DELIVERY_CONCURRENCY:-2}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
